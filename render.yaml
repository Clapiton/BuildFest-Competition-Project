services:
  - type: web
    name: buildfest-competition-project
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NOTIFICATION_MODE
        value: console
      - key: ESCALATION_DELAY_MS
        value: "180000"
      - key: NODE_ENV
        value: production
      - key: ADMIN_API_KEY
        value: "buildfest-admin-2026"
      - key: ALLOWED_ORIGINS
        value: "https://buildfest-competition-project.onrender.com,http://localhost:3000"
      - key: APP_URL
        sync: false
      - key: UPTIMEROBOT_API_KEY
        sync: false

